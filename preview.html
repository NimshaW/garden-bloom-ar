<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garden Bloom — 3D Preview</title><link rel="stylesheet" href="styles.css">
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script><script src="js/garden.js"></script>
<style>html,body{background:#193c31!important}.preview-hint{position:fixed;top:110px;left:50%;transform:translateX(-50%);font-size:12px;z-index:70;background:#08271bcc;padding:10px 14px;border-radius:12px;text-align:center;width:max-content;max-width:90%}#garden-scene{background:#234b38!important}</style></head>
<body>
<div id="scene-mount"></div>
<header id="topbar"><div class="brand"><span class="brand-flower">✿</span> GARDEN BLOOM / 3D PREVIEW</div><div class="state ok">No camera needed</div></header>
<p class="preview-hint">3D demo only. <a href="index.html">Open live camera AR</a> to scan the Hiro marker.</p>
<section id="garden-controls" class="garden-controls"><div class="controls-heading"><strong>INTERACTIVE GARDEN</strong><span id="feedback">Tap a flower, cloud, firefly, or the buttons below.</span></div><div class="activity-grid">
<button class="activity" data-action="bloom"><span class="emoji">🌷</span><span><strong>Bloom</strong><small>Open flower</small></span></button>
<button class="activity" data-action="water"><span class="emoji">💧</span><span><strong>Rain</strong><small>Grow plants</small></span></button>
<button class="activity" data-action="glow"><span class="emoji">✨</span><span><strong>Firefly</strong><small>Change glow</small></span></button>
</div></section>
<script>
(async function () {
  try {
    const text=await (await fetch('index.html',{cache:'no-store'})).text();
    const remote=new DOMParser().parseFromString(text,'text/html');
    const template=remote.querySelector('#scene-template');
    if(!template) throw new Error('Garden scene template missing');
    const tree=document.importNode(template.content,true);
    const scene=tree.querySelector('a-scene');
    scene.removeAttribute('arjs');
    scene.setAttribute('background','color: #234b38; transparent: false');
    const marker=tree.querySelector('#hiro-marker');
    const garden=document.createElement('a-entity');
    garden.setAttribute('id','preview-garden');
    while(marker.firstChild) garden.appendChild(marker.firstChild);
    marker.parentNode.replaceChild(garden,marker);
    const camera=scene.querySelector('[camera]');
    camera.setAttribute('position','0 1.5 2.5');
    camera.setAttribute('rotation','-28 0 0');
    document.getElementById('scene-mount').appendChild(tree);
    document.querySelectorAll('[data-action]').forEach(function(button){button.addEventListener('click',function(){
      const ids={bloom:['flower','bloom-toggle'],water:['cloud','water-garden'],glow:['firefly','color-changer']};
      const [id,name]=ids[button.dataset.action];
      const entity=document.getElementById(id);
      if(entity && entity.components && entity.components[name])entity.components[name].activate();
    });});
  } catch(error){document.getElementById('feedback').textContent='Preview loading issue: '+error.message;}
})();
</script>
</body></html>
